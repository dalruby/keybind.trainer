<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>keybind.trainer</title>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b80f0"/>
      <stop offset="1" stop-color="#3157d5"/>
    </linearGradient>
  </defs>
  <!-- keycap body (the darker rim shows it is raised) -->
  <rect x="4" y="6" width="56" height="54" rx="13" fill="#1d3a9e"/>
  <!-- top face -->
  <rect x="9" y="8" width="46" height="42" rx="10" fill="url(#face)"/>
  <!-- fingertip print: nested loops that run down the sides, like a fingertip pad -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="3">
    <path d="M20 44 V28 a12 12 0 0 1 24 0 V40"/>
    <path d="M26 44 V29 a6 6 0 0 1 12 0 V44"/>
    <path d="M32 31 V41"/>
  </g>
</svg>
